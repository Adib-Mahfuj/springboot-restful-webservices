spring.application.name=springboot-restful-webservices
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:ORCL
spring.datasource.username=user_management
spring.datasource.password=user

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.open-in-view=false
spring.jpa.show-sql= true
spring.jpa.hibernate.ddl-auto=update

#for Actuator
#for /info
management.endpoints.web.exposure.include=*

management.info.env.enabled=true
management.endpoint.shutdown.enabled=true

#for /health
management.endpoint.health.show-details=always

info.app.name=Spring Boot Restful Web Services
info.app.description=Spring Boot Restful Web Services Demo
info.app.version=1.0.0

